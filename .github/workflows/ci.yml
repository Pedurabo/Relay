name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android build, unit tests, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-37.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

  backend:
    name: Backend dependency and syntax validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: node --check server.js

      - name: Verify backend authentication
        run: npm run test:auth

      - name: Verify login abuse rate limiting
        run: npm run test:login-rate-limit

      - name: Verify session and push pruning
        run: npm run test:pruning

      - name: Verify session tokens are protected at rest
        run: npm run test:token-storage

      - name: Verify SQLite persistence and authorization
        run: npm run test:storage

      - name: Verify versioned SQLite migrations
        run: npm run test:migrations

      - name: Verify restart-level backend behavior
        run: npm run test:restart

      - name: Verify production configuration safety
        run: npm run test:config

      - name: Verify SQLite backup and restore
        run: npm run test:backup

      - name: Verify push authorization and payload policy
        run: npm run test:push

      - name: Verify realtime incident authorization
        run: npm run test:authorization
